system_config:
  hostname: primary-server-01
  ip_address: 192.168.1.100
  port: 8080
  interfaces:
    - name: eth0
      enabled: true
      mtu: 1500
      mac_address: "00:1B:44:11:3A:B7"
    - name: eth1
      enabled: false
      mtu: 9000
  diagnostics:
    log_level: DEBUG
    max_log_size: 10485760
    trace_enabled: true

applications:
  - app_name: web_gateway
    version: 2.4.1
    auto_start: true
    dependencies:
      - auth_service
      - db_connector
    environment:
      env_var1: "production"
      env_var2: "secure"
  - app_name: background_worker
    version: 1.0.0
    auto_start: false
    dependencies:
      - task_queue
    environment:
      env_var1: "staging"
